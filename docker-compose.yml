services:
  cv-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: ehsancv/latex:latest
    working_dir: /work
    volumes:
      - .:/work
      - luatex-cache:/var/lib/texmf # Persist LuaTeX font cache
    environment:
      - OUTDIR=pdf
      - AUXDIR=build
    command: []

volumes:
  luatex-cache:
